<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>西瓜闹钟 🍉</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --sub: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --dark-bg: #0f172a;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    
    .app-viewport {
      width: 100%;
      height: 100%;
      max-width: 540px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top, 12px);
      padding-bottom: env(safe-area-inset-bottom, 12px);
      position: relative;
      background: var(--bg);
    }

    /* 视图通用容器 */
    .view-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }

    /* 列表页头部 */
    .list-header {
      padding: 16px 20px 8px;
    }
    .list-header h1 {
      font-size: 28px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.5px;
    }
    .list-header p {
      font-size: 13px;
      color: var(--sub);
      margin-top: 4px;
    }

    /* 闹钟列表 */
    .alarm-list {
      padding: 10px 16px 90px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .alarm-card {
      background: var(--card);
      border-radius: 20px;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.03), 0 1px 2px rgba(0,0,0,0.02);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .alarm-card:active { transform: scale(0.98); }
    .alarm-info { flex: 1; }
    .alarm-time {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--text);
      line-height: 1;
    }
    .alarm-disabled .alarm-time, .alarm-disabled .alarm-label {
      color: #94a3b8;
    }
    .alarm-label {
      font-size: 15px;
      font-weight: 600;
      margin-top: 6px;
    }
    .alarm-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .tag {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: #e0f2fe;
      color: #0369a1;
    }
    .tag-workday { background: #dbeafe; color: #1d4ed8; }
    .tag-weekend { background: #fef3c7; color: #b45309; }
    .tag-month { background: #f3e8ff; color: #7e22ce; }
    .tag-year { background: #fce7f3; color: #be185d; }
    .next-trigger-hint {
      font-size: 12px;
      color: #059669;
      font-weight: 600;
    }

    /* Switch 开关 */
    .switch {
      position: relative;
      display: inline-block;
      width: 52px;
      height: 30px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #cbd5e1;
      transition: .25s;
      border-radius: 30px;
    }
    .slider:before {
      position: absolute; content: "";
      height: 24px; width: 24px; left: 3px; bottom: 3px;
      background-color: white;
      transition: .25s;
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.25);
    }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(22px); }

    /* 悬浮新建按钮 */
    .fab-btn {
      position: fixed;
      bottom: max(24px, env(safe-area-inset-bottom, 16px) + 16px);
      right: 20px;
      background: var(--primary);
      color: #fff;
      padding: 14px 22px;
      border-radius: 32px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(37,99,235,0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 40;
      transition: transform 0.15s;
    }
    .fab-btn:active { transform: scale(0.95); }

    /* 编辑器页面 */
    .editor-view {
      padding: 16px 20px 60px;
      background: var(--bg);
    }
    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .editor-header h2 { font-size: 20px; font-weight: 800; }
    .btn-text { background: none; border: none; font-size: 16px; font-weight: 700; color: var(--primary); cursor: pointer; padding: 4px 8px; }
    .btn-cancel { color: var(--sub); }

    .form-group { margin-bottom: 20px; }
    .form-label { font-size: 13px; font-weight: 700; color: var(--sub); margin-bottom: 8px; display: block; }
    .form-input {
      width: 100%;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 16px;
      color: var(--text);
      outline: none;
    }
    .form-input:focus { border-color: var(--primary); }

    /* 时间下拉选选择器 */
    .time-picker-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
    }
    .time-select-wrap {
      display: flex;
      align-items: center;
      background: #f8fafc;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 6px 14px;
    }
    .time-select-wrap select {
      font-size: 36px;
      font-weight: 800;
      color: var(--text);
      border: none;
      background: transparent;
      outline: none;
      cursor: pointer;
      text-align: center;
      padding: 2px;
    }
    .time-select-wrap select option {
      font-size: 16px;
      font-weight: 600;
    }
    .time-unit-label {
      font-size: 14px;
      font-weight: 700;
      color: var(--sub);
      margin-left: 4px;
    }
    .time-colon { font-size: 36px; font-weight: 800; color: var(--sub); }

    /* 周期网格 */
    .chip-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .chip {
      padding: 10px 16px;
      border-radius: 24px;
      background: #e2e8f0;
      border: none;
      font-size: 14px;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
      transition: .15s;
    }
    .chip.active { background: var(--primary); color: #fff; }

    /* 工作日模式选择卡片 */
    .mode-card {
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-top: 10px;
      cursor: pointer;
      transition: .15s;
    }
    .mode-card.active {
      border-color: var(--primary);
      background: #eff6ff;
    }
    .mode-card-title { font-size: 15px; font-weight: 700; color: #1e293b; }
    .mode-card.active .mode-card-title { color: var(--primary); }
    .mode-card-desc { font-size: 12px; color: #64748b; margin-top: 4px; }
    .mode-card.active .mode-card-desc { color: #3b82f6; }

    /* 星期选择 */
    .week-row { display: flex; justify-content: space-between; margin-top: 10px; }
    .week-btn {
      width: 42px; height: 42px; border-radius: 50%;
      border: none; background: #e2e8f0; font-size: 14px; font-weight: 700;
      color: #475569; cursor: pointer;
    }
    .week-btn.active { background: var(--primary); color: #fff; }

    /* 月 / 年下拉选择 */
    .custom-select-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 16px;
    }
    .custom-select {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      background: #f8fafc;
      outline: none;
      cursor: pointer;
    }

    /* 响铃全屏界面 */
    .ring-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--dark-bg);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 24px;
      color: #fff;
      text-align: center;
      animation: fadeIn .25s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .bell-animation {
      font-size: 80px;
      animation: bellPulse 1.2s infinite ease-in-out;
      margin-bottom: 24px;
    }
    @keyframes bellPulse {
      0%, 100% { transform: scale(1) rotate(0deg); }
      20% { transform: scale(1.15) rotate(-15deg); }
      40% { transform: scale(1.15) rotate(15deg); }
      60% { transform: scale(1.15) rotate(-10deg); }
      80% { transform: scale(1.15) rotate(10deg); }
    }
    .ring-time { font-size: 64px; font-weight: 900; letter-spacing: -2px; }
    .ring-title { font-size: 24px; font-weight: 800; margin-top: 8px; color: #e2e8f0; }
    .ring-sub { font-size: 15px; color: #94a3b8; margin-top: 6px; }
    
    .ring-actions { width: 100%; max-width: 320px; margin-top: 56px; display: flex; flex-direction: column; gap: 16px; }
    .btn-stop {
      width: 100%;
      background: var(--danger);
      color: #fff;
      padding: 18px;
      border-radius: 36px;
      border: none;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(239,68,68,0.4);
    }
    .btn-stop:active { background: var(--danger-hover); transform: scale(0.98); }
    .btn-snooze {
      width: 100%;
      background: transparent;
      border: 1px solid #475569;
      color: #cbd5e1;
      padding: 16px;
      border-radius: 36px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-snooze:active { background: rgba(255,255,255,0.05); }
  </style>
</head>
<body>

<div class="app-viewport">
  <!-- 视图1：闹钟列表 -->
  <div id="viewList" class="view-content">
    <div class="list-header">
      <h1>西瓜闹钟 🍉</h1>
      <p id="alarmSummary">已开启 3 个闹钟 · 智能调休已就绪</p>
    </div>
    <div class="alarm-list" id="alarmListContainer"></div>
    <button class="fab-btn" onclick="openEditor(null)">+ 新建闹钟</button>
  </div>

  <!-- 视图2：编辑/新建闹钟 -->
  <div id="viewEditor" class="view-content" style="display: none;">
    <div class="editor-view">
      <div class="editor-header">
        <button class="btn-text btn-cancel" onclick="closeEditor()">取消</button>
        <h2 id="editorTitle">编辑闹钟</h2>
        <button class="btn-text" onclick="saveAlarm()">保存</button>
      </div>

      <!-- 时间下拉选择 -->
      <div class="form-group">
        <label class="form-label">触发时间（24小时制）</label>
        <div class="time-picker-row">
          <div class="time-select-wrap">
            <select id="editHourSelect"></select>
            <span class="time-unit-label">时</span>
          </div>
          <span class="time-colon">:</span>
          <div class="time-select-wrap">
            <select id="editMinuteSelect"></select>
            <span class="time-unit-label">分</span>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">闹钟标签</label>
        <input type="text" id="editLabel" class="form-input" placeholder="输入闹钟名称">
      </div>

      <div class="form-group">
        <label class="form-label">重复周期</label>
        <div class="chip-grid" id="freqChips"></div>
      </div>

      <!-- 工作日/节假日专属子模式 -->
      <div id="workdayModeSection" class="form-group" style="display: none;">
        <label class="form-label">工作日 / 调休设置</label>
        <div class="mode-card active" id="modeChina" onclick="setWorkdayMode('china')">
          <div class="mode-card-title">🇨🇳 中国法定调休（推荐）</div>
          <div class="mode-card-desc">自动跳过国家法定放假日，周末调休补班准时响铃</div>
        </div>
        <div class="mode-card" id="modeStandard" onclick="setWorkdayMode('standard')">
          <div class="mode-card-title">📅 普通周一至周五</div>
          <div class="mode-card-desc">仅固定周一至周五响铃，不随节假日调整</div>
        </div>
      </div>

      <!-- 每周星期选择 -->
      <div id="weekdaySection" class="form-group" style="display: none;">
        <label class="form-label">选择重复星期</label>
        <div class="week-row" id="weekdayRow"></div>
      </div>

      <!-- 每月日期选择 -->
      <div id="monthdaySection" class="form-group" style="display: none;">
        <label class="form-label">每月第几天响铃</label>
        <div class="custom-select-row">
          <select id="editMonthDaySelect" class="custom-select"></select>
        </div>
      </div>

      <!-- 每年日期选择 -->
      <div id="yeardaySection" class="form-group" style="display: none;">
        <label class="form-label">每年响铃日期</label>
        <div class="custom-select-row">
          <select id="editYearMonthSelect" class="custom-select" style="flex:1;"></select>
          <select id="editYearDaySelect" class="custom-select" style="flex:1;"></select>
        </div>
      </div>

      <div class="form-group" style="display:flex; justify-content:space-between; align-items:center; background:#fff; padding:14px 16px; border-radius:14px; border:1px solid var(--border);">
        <span style="font-size:15px; font-weight:700;">振动提示</span>
        <label class="switch">
          <input type="checkbox" id="editVibrate" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

  <!-- 视图3：到点响铃全屏 -->
  <div id="viewRing" class="ring-screen" style="display: none;">
    <div class="bell-animation">🔔</div>
    <div class="ring-time" id="ringTime">07:30</div>
    <div class="ring-title" id="ringLabel">工作日起床</div>
    <div class="ring-sub">时间到！闹钟正在响铃...</div>
    <div class="ring-actions">
      <button class="btn-stop" onclick="dismissAlarm()">停止响铃</button>
      <button class="btn-snooze" onclick="snoozeAlarm()">贪睡 5 分钟</button>
    </div>
  </div>
</div>

<script>
  // --- 核心节假日数据集与判定引擎 ---
  const HOLIDAYS_SET = new Set([
    '2026-01-01', '2026-01-02', '2026-01-03',
    '2026-02-15', '2026-02-16', '2026-02-17', '2026-02-18', '2026-02-19', '2026-02-20', '2026-02-21', '2026-02-22',
    '2026-04-04', '2026-04-05', '2026-04-06',
    '2026-05-01', '2026-05-02', '2026-05-03', '2026-05-04', '2026-05-05',
    '2026-06-19', '2026-06-20', '2026-06-21',
    '2026-09-25', '2026-09-26', '2026-09-27',
    '2026-10-01', '2026-10-02', '2026-10-03', '2026-10-04', '2026-10-05', '2026-10-06', '2026-10-07'
  ]);
  const MAKEUP_WORKDAYS_SET = new Set([
    '2026-01-04', '2026-02-14', '2026-02-28', '2026-04-26', '2026-05-09', '2026-10-10'
  ]);

  function isWorkday(y, m, d, mode = 'china') {
    const wd = new Date(Date.UTC(y, m - 1, d)).getUTCDay();
    const isWeekend = wd === 0 || wd === 6;
    if (mode === 'standard') return !isWeekend;
    const key = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    if (MAKEUP_WORKDAYS_SET.has(key)) return true;
    if (HOLIDAYS_SET.has(key)) return false;
    return !isWeekend;
  }

  function addDays(y, m, d, n) {
    const dt = new Date(Date.UTC(y, m - 1, d) + n * 86400000);
    return { year: dt.getUTCFullYear(), month: dt.getUTCMonth() + 1, day: dt.getUTCDate() };
  }

  function nextTrigger(alarm, from) {
    const fromDt = new Date(from);
    if (alarm.freq === 'once') return alarm.fireAt > from ? alarm.fireAt : null;
    
    const fDt = new Date(alarm.fireAt);
    const H = fDt.getHours(), M = fDt.getMinutes(), S = fDt.getSeconds();

    let cur = { year: fromDt.getFullYear(), month: fromDt.getMonth() + 1, day: fromDt.getDate() };
    for (let i = 0; i < 3650; i++) {
      let match = false;
      if (alarm.freq === 'workday') match = isWorkday(cur.year, cur.month, cur.day, alarm.workdayMode);
      else if (alarm.freq === 'weekend') match = !isWorkday(cur.year, cur.month, cur.day, alarm.workdayMode);
      else if (alarm.freq === 'day') match = true;
      else if (alarm.freq === 'week') {
        const wd = new Date(Date.UTC(cur.year, cur.month - 1, cur.day)).getUTCDay();
        match = (alarm.byWeekday || []).includes(wd);
      }
      else if (alarm.freq === 'month') {
        match = (alarm.byMonthday || []).includes(cur.day);
      }
      else if (alarm.freq === 'year') {
        const monthOk = (alarm.byMonth || []).includes(cur.month);
        const dayOk = (alarm.byMonthday || []).includes(cur.day);
        match = monthOk && dayOk;
      }

      if (match) {
        const cand = new Date(cur.year, cur.month - 1, cur.day, H, M, S).getTime();
        if (cand > from) return cand;
      }
      cur = addDays(cur.year, cur.month, cur.day, 1);
    }
    return null;
  }

  // --- 本地持久化缓存 ---
  function loadStoredAlarms() {
    try {
      const s = localStorage.getItem('watermelon_alarms');
      if (s) return JSON.parse(s);
    } catch(e) {}
    return [
      {
        id: '1',
        label: '工作日起床',
        enabled: true,
        fireAt: new Date().setHours(7, 30, 0, 0),
        freq: 'workday',
        workdayMode: 'china',
        vibrate: true
      },
      {
        id: '2',
        label: '每月还信用卡',
        enabled: true,
        fireAt: new Date().setHours(10, 0, 0, 0),
        freq: 'month',
        byMonthday: [15],
        vibrate: true
      },
      {
        id: '3',
        label: '结婚纪念日',
        enabled: true,
        fireAt: new Date().setHours(9, 0, 0, 0),
        freq: 'year',
        byMonth: [5],
        byMonthday: [20],
        vibrate: true
      },
      {
        id: '4',
        label: '周末自然醒',
        enabled: false,
        fireAt: new Date().setHours(10, 0, 0, 0),
        freq: 'weekend',
        workdayMode: 'china',
        vibrate: true
      }
    ];
  }

  function persistAlarms() {
    try {
      localStorage.setItem('watermelon_alarms', JSON.stringify(alarms));
    } catch(e) {}
  }

  let alarms = loadStoredAlarms();
  let currentEditingAlarm = null;
  let activeFreq = 'workday';
  let activeWorkdayMode = 'china';
  let activeWeekdays = [1, 2, 3, 4, 5];

  // --- 原生桥接注册 ---
  function syncNativeAlarm(alarm) {
    if (window.AndroidAlarm) {
      if (alarm.enabled) {
        const next = nextTrigger(alarm, Date.now());
        if (next) window.AndroidAlarm.setAlarm(alarm.id, next, alarm.label);
      } else {
        window.AndroidAlarm.cancelAlarm(alarm.id);
      }
    }
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iOSAlarm) {
      if (alarm.enabled) {
        const next = nextTrigger(alarm, Date.now());
        if (next) window.webkit.messageHandlers.iOSAlarm.postMessage({ action: 'setAlarm', id: alarm.id, timestamp: next, label: alarm.label });
      } else {
        window.webkit.messageHandlers.iOSAlarm.postMessage({ action: 'cancelAlarm', id: alarm.id });
      }
    }
  }

  // --- 音效发生器与停止处理 ---
  let audioCtx = null;
  let audioTimer = null;
  function playRingtone() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const playBeep = () => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
      };
      playBeep();
      audioTimer = setInterval(playBeep, 900);
    } catch(e) {}
  }

  function stopRingtone() {
    if (audioTimer) { clearInterval(audioTimer); audioTimer = null; }
    if (window.AndroidAlarm) {
      window.AndroidAlarm.stopRing();
    }
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iOSAlarm) {
      window.webkit.messageHandlers.iOSAlarm.postMessage({ action: 'stopRing' });
    }
  }

  // --- UI 初始化与渲染 ---
  const FREQS = [
    { key: 'once', label: '单次' },
    { key: 'workday', label: '工作日' },
    { key: 'weekend', label: '周末/节假日' },
    { key: 'day', label: '每天' },
    { key: 'week', label: '每周' },
    { key: 'month', label: '每月' },
    { key: 'year', label: '每年' },
  ];
  const WEEK_NAMES = ['日', '一', '二', '三', '四', '五', '六'];

  function initTimeOptions() {
    const hSelect = document.getElementById('editHourSelect');
    hSelect.innerHTML = Array.from({length: 24}, (_, i) => {
      const val = String(i).padStart(2, '0');
      return `<option value="${i}">${val}</option>`;
    }).join('');

    const mSelect = document.getElementById('editMinuteSelect');
    mSelect.innerHTML = Array.from({length: 60}, (_, i) => {
      const val = String(i).padStart(2, '0');
      return `<option value="${i}">${val}</option>`;
    }).join('');

    const mdSelect = document.getElementById('editMonthDaySelect');
    mdSelect.innerHTML = Array.from({length: 31}, (_, i) => {
      return `<option value="${i+1}">每月 ${i+1} 号</option>`;
    }).join('');

    const ymSelect = document.getElementById('editYearMonthSelect');
    ymSelect.innerHTML = Array.from({length: 12}, (_, i) => {
      return `<option value="${i+1}">${i+1} 月</option>`;
    }).join('');

    const ydSelect = document.getElementById('editYearDaySelect');
    ydSelect.innerHTML = Array.from({length: 31}, (_, i) => {
      return `<option value="${i+1}">${i+1} 日</option>`;
    }).join('');
  }

  function renderList() {
    const container = document.getElementById('alarmListContainer');
    const now = Date.now();
    let enabledCount = 0;

    container.innerHTML = alarms.map(a => {
      if (a.enabled) enabledCount++;
      const next = a.enabled ? nextTrigger(a, now) : null;
      let nextStr = '';
      if (next) {
        const diffMin = Math.round((next - now) / 60000);
        if (diffMin < 60) nextStr = `⏱️ ${diffMin <= 0 ? '即将触发' : diffMin + ' 分钟后响铃'}`;
        else nextStr = `📅 下次触发: ${new Date(next).toLocaleDateString()} ${new Date(next).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
      }

      const d = new Date(a.fireAt);
      const timeStr = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      
      let tagHtml = '';
      if (a.freq === 'workday') {
        tagHtml = `<span class="tag tag-workday">${a.workdayMode === 'china' ? '法定工作日 (智能调休)' : '工作日(周一至五)'}</span>`;
      } else if (a.freq === 'weekend') {
        tagHtml = `<span class="tag tag-weekend">${a.workdayMode === 'china' ? '法定节假日/周末' : '周末'}</span>`;
      } else if (a.freq === 'day') {
        tagHtml = `<span class="tag">每天</span>`;
      } else if (a.freq === 'week') {
        tagHtml = `<span class="tag">每周 ${(a.byWeekday||[]).map(w=>WEEK_NAMES[w]).join(' ')}</span>`;
      } else if (a.freq === 'month') {
        tagHtml = `<span class="tag tag-month">每月 ${(a.byMonthday||[1])[0]} 号</span>`;
      } else if (a.freq === 'year') {
        tagHtml = `<span class="tag tag-year">每年 ${(a.byMonth||[1])[0]}月${(a.byMonthday||[1])[0]}日</span>`;
      } else {
        tagHtml = `<span class="tag">单次</span>`;
      }

      return `
        <div class="alarm-card ${a.enabled ? '' : 'alarm-disabled'}" onclick="openEditor('${a.id}')">
          <div class="alarm-info">
            <div class="alarm-time">${timeStr}</div>
            <div class="alarm-label">${a.label}</div>
            <div class="alarm-meta">
              ${tagHtml}
              ${nextStr ? `<span class="next-trigger-hint">${nextStr}</span>` : ''}
            </div>
          </div>
          <label class="switch" onclick="event.stopPropagation()">
            <input type="checkbox" ${a.enabled ? 'checked' : ''} onchange="toggleAlarm('${a.id}', this.checked)">
            <span class="slider"></span>
          </label>
        </div>
      `;
    }).join('');

    document.getElementById('alarmSummary').innerText = `已开启 ${enabledCount} 个闹钟 · 智能调休已就绪`;
  }

  function toggleAlarm(id, enabled) {
    const a = alarms.find(x => x.id === id);
    if (a) {
      a.enabled = enabled;
      syncNativeAlarm(a);
      persistAlarms();
      renderList();
    }
  }

  function openEditor(id) {
    const a = id ? alarms.find(x => x.id === id) : null;
    currentEditingAlarm = a;
    document.getElementById('editorTitle').innerText = a ? '编辑闹钟' : '新建闹钟';
    
    const d = a ? new Date(a.fireAt) : new Date();
    document.getElementById('editHourSelect').value = d.getHours();
    document.getElementById('editMinuteSelect').value = d.getMinutes();
    document.getElementById('editLabel').value = a ? a.label : '我的闹钟';
    document.getElementById('editVibrate').checked = a ? a.vibrate : true;

    activeFreq = a ? a.freq : 'workday';
    activeWorkdayMode = a ? (a.workdayMode || 'china') : 'china';
    activeWeekdays = a && a.byWeekday ? [...a.byWeekday] : [1, 2, 3, 4, 5];

    if (a && a.byMonthday && a.byMonthday[0]) {
      document.getElementById('editMonthDaySelect').value = a.byMonthday[0];
      document.getElementById('editYearDaySelect').value = a.byMonthday[0];
    } else {
      document.getElementById('editMonthDaySelect').value = d.getDate();
      document.getElementById('editYearDaySelect').value = d.getDate();
    }

    if (a && a.byMonth && a.byMonth[0]) {
      document.getElementById('editYearMonthSelect').value = a.byMonth[0];
    } else {
      document.getElementById('editYearMonthSelect').value = d.getMonth() + 1;
    }

    renderFreqChips();
    renderWorkdayMode();
    renderWeekdays();

    document.getElementById('viewList').style.display = 'none';
    document.getElementById('viewEditor').style.display = 'flex';
  }

  function closeEditor() {
    document.getElementById('viewEditor').style.display = 'none';
    document.getElementById('viewList').style.display = 'flex';
  }

  function renderFreqChips() {
    document.getElementById('freqChips').innerHTML = FREQS.map(f => `
      <button type="button" class="chip ${activeFreq === f.key ? 'active' : ''}" onclick="selectFreq('${f.key}')">${f.label}</button>
    `).join('');
    
    document.getElementById('workdayModeSection').style.display = (activeFreq === 'workday' || activeFreq === 'weekend') ? 'block' : 'none';
    document.getElementById('weekdaySection').style.display = (activeFreq === 'week') ? 'block' : 'none';
    document.getElementById('monthdaySection').style.display = (activeFreq === 'month') ? 'block' : 'none';
    document.getElementById('yeardaySection').style.display = (activeFreq === 'year') ? 'block' : 'none';
  }

  function selectFreq(key) {
    activeFreq = key;
    renderFreqChips();
  }

  function renderWorkdayMode() {
    document.getElementById('modeChina').className = `mode-card ${activeWorkdayMode === 'china' ? 'active' : ''}`;
    document.getElementById('modeStandard').className = `mode-card ${activeWorkdayMode === 'standard' ? 'active' : ''}`;
  }

  function setWorkdayMode(m) {
    activeWorkdayMode = m;
    renderWorkdayMode();
  }

  function renderWeekdays() {
    document.getElementById('weekdayRow').innerHTML = WEEK_NAMES.map((w, idx) => `
      <button type="button" class="week-btn ${activeWeekdays.includes(idx) ? 'active' : ''}" onclick="toggleWeekday(${idx})">${w}</button>
    `).join('');
  }

  function toggleWeekday(idx) {
    if (activeWeekdays.includes(idx)) activeWeekdays = activeWeekdays.filter(x => x !== idx);
    else activeWeekdays.push(idx);
    renderWeekdays();
  }

  function saveAlarm() {
    const h = parseInt(document.getElementById('editHourSelect').value, 10);
    const m = parseInt(document.getElementById('editMinuteSelect').value, 10);
    const label = document.getElementById('editLabel').value.trim() || '闹钟';
    const vibrate = document.getElementById('editVibrate').checked;
    const monthDay = parseInt(document.getElementById('editMonthDaySelect').value, 10);
    const yearMonth = parseInt(document.getElementById('editYearMonthSelect').value, 10);
    const yearDay = parseInt(document.getElementById('editYearDaySelect').value, 10);

    const fireAt = new Date().setHours(h, m, 0, 0);

    const byMonthday = activeFreq === 'month' ? [monthDay] : (activeFreq === 'year' ? [yearDay] : undefined);
    const byMonth = activeFreq === 'year' ? [yearMonth] : undefined;

    let targetAlarm;
    if (currentEditingAlarm) {
      currentEditingAlarm.label = label;
      currentEditingAlarm.fireAt = fireAt;
      currentEditingAlarm.freq = activeFreq;
      currentEditingAlarm.workdayMode = activeWorkdayMode;
      currentEditingAlarm.byWeekday = activeWeekdays;
      currentEditingAlarm.byMonthday = byMonthday;
      currentEditingAlarm.byMonth = byMonth;
      currentEditingAlarm.vibrate = vibrate;
      currentEditingAlarm.enabled = true;
      targetAlarm = currentEditingAlarm;
    } else {
      targetAlarm = {
        id: 'al_' + Date.now().toString(36),
        label,
        fireAt,
        freq: activeFreq,
        workdayMode: activeWorkdayMode,
        byWeekday: activeWeekdays,
        byMonthday,
        byMonth,
        vibrate,
        enabled: true
      };
      alarms.push(targetAlarm);
    }
    
    syncNativeAlarm(targetAlarm);
    persistAlarms();
    closeEditor();
    renderList();
  }

  function ring(alarm) {
    playRingtone();
    const d = new Date(alarm.fireAt);
    document.getElementById('ringTime').innerText = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    document.getElementById('ringLabel').innerText = alarm.label;
    document.getElementById('viewRing').style.display = 'flex';
  }

  function dismissAlarm() {
    stopRingtone();
    document.getElementById('viewRing').style.display = 'none';
  }

  function snoozeAlarm() {
    stopRingtone();
    document.getElementById('viewRing').style.display = 'none';
    setTimeout(() => {
      ring({ label: '贪睡提醒', fireAt: Date.now() });
    }, 5000);
  }

  // --- 静默云端同步 ---
  async function silentSyncHolidays() {
    try {
      const res = await fetch('https://www.xiguazi.online/alarm/holidays.json');
      if (res.ok) {
        const data = await res.json();
        (data.holidays || []).forEach(h => HOLIDAYS_SET.add(h));
        (data.makeupWorkdays || []).forEach(w => MAKEUP_WORKDAYS_SET.add(w));
        renderList();
      }
    } catch(e) {}
  }

  // --- 主循环与初始化 ---
  setInterval(() => {
    const nowMs = Date.now();
    alarms.forEach(a => {
      if (a.enabled) {
        const next = nextTrigger(a, nowMs - 1000);
        if (next && Math.abs(next - nowMs) < 1000) {
          ring(a);
        }
      }
    });
  }, 1000);

  initTimeOptions();
  renderList();
  silentSyncHolidays();

  // 向原生层初始化所有闹钟
  alarms.forEach(a => syncNativeAlarm(a));
</script>
</body>
</html>
