# 腾讯云轻量服务器 Nginx 配置片段
# 适用于站点：www.xiguazi.online
# 将以下配置加入到已有的 server { ... } 块中，与您的主程序并存，零端口冲突与零资源占用。

location /alarm/ {
    # 静态 JSON 存放目录
    alias /var/www/alarm-clock/;
    
    # 跨域与缓存配置
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods 'GET, OPTIONS';
    add_header Cache-Control "public, max-age=86400";
    
    # 返回 JSON 字符集 UTF-8
    charset utf-8;
}
