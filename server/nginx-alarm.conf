# 腾讯云轻量服务器 Nginx 配置片段
# 适用于站点：www.xiguazi.online（已整合至「第一桶金」mahjong.conf）
# 推荐采用反向代理模式，本地安全端口 28080，对外统一通过 443 (HTTPS) 访问。

# 方式一：反向代理模式（已在第一桶金 mahjong.conf 中采用，推荐）
location ^~ /alarm/ {
    proxy_pass http://127.0.0.1:28080/;
    proxy_set_header Host $host;
    add_header Access-Control-Allow-Origin *;
}

