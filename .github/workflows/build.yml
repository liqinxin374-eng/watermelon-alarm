name: Build AlarmClock (EAS Cloud)
# 在云端为 Android + iOS 出包（iOS 在云端 Mac 编译，无需自有 Mac）
# 前置：仓库 Secrets 配置 EXPO_TOKEN（eas login 后 `eas secret:create` 或 CI token）
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm install -g eas-cli
      - run: eas build --platform android --profile production --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - run: eas build --platform ios --profile production --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
