name: 🍉 西瓜闹钟 · 云端一键出包 (Android APK + iOS IPA)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

jobs:
  build-android:
    name: 🤖 编译生成 Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 赋予 Gradle 执行权限
        run: chmod +x android/gradlew

      - name: 编译 Android APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 整理并重命名安装包
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/西瓜闹钟_v1.0.0.apk

      - name: 📤 上传 Android APK (供手机直接安装)
        uses: actions/upload-artifact@v4
        with:
          name: 西瓜闹钟_Android_APK安装包
          path: output_apk/西瓜闹钟_v1.0.0.apk
          retention-days: 30

  build-ios:
    name: 🍏 编译生成 iOS IPA 安装包 (适配爱思助手/AltStore)
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 创建 App 目录结构
        run: |
          mkdir -p build/Payload/WatermelonAlarm.app
          mkdir -p output_ipa

      - name: 使用 SwiftC 针对 ARM64 编译 iOS 原生二进制
        run: |
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios14.0 \
            -parse-as-library \
            ios/WatermelonAlarm/AppDelegate.swift \
            ios/WatermelonAlarm/ViewController.swift \
            -o build/Payload/WatermelonAlarm.app/WatermelonAlarm \
            -framework UIKit \
            -framework WebKit \
            -framework UserNotifications \
            -framework AVFoundation \
            -framework AudioToolbox

      - name: 注入 App 描述配置、桌面图标与铃声资源
        run: |
          cp ios/WatermelonAlarm/Info.plist build/Payload/WatermelonAlarm.app/
          cp ios/WatermelonAlarm/AppIcon.png build/Payload/WatermelonAlarm.app/
          cp ios/WatermelonAlarm/AppIcon.png build/Payload/WatermelonAlarm.app/AppIcon60x60@2x.png
          cp ios/WatermelonAlarm/AppIcon.png build/Payload/WatermelonAlarm.app/AppIcon60x60@3x.png
          cp ios/WatermelonAlarm/AppIcon.png build/Payload/WatermelonAlarm.app/AppIcon76x76@2x~ipad.png
          cp ios/AlarmBridge/default.wav build/Payload/WatermelonAlarm.app/
          cp preview/index.html build/Payload/WatermelonAlarm.app/

      - name: 打包生成标准的 .ipa 文件
        run: |
          cd build
          zip -qr ../output_ipa/西瓜闹钟_v1.0.0.ipa Payload/

      - name: 📤 上传 iOS IPA 安装包 (供爱思助手直接签名安装)
        uses: actions/upload-artifact@v4
        with:
          name: 西瓜闹钟_iOS_IPA安装包
          path: output_ipa/西瓜闹钟_v1.0.0.ipa
          retention-days: 30
