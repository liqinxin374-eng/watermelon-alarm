name: 🍉 西瓜闹钟 · 云端一键出包 (Android + iOS)

on:
  workflow_dispatch: # 支持在 GitHub 网页上点击按钮手动触发
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

jobs:
  build-android:
    name: 🤖 编译生成 Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 赋予 Gradle 执行权限
        run: chmod +x android/gradlew

      - name: 编译 Android APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 整理并重命名安装包
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/西瓜闹钟_v1.0.0.apk

      - name: 📤 上传 Android APK (供直接下载安装)
        uses: actions/upload-artifact@v4
        with:
          name: 西瓜闹钟_Android_APK
          path: output_apk/西瓜闹钟_v1.0.0.apk
          retention-days: 30

  build-ios:
    name: 🍏 编译生成 iOS 产物包
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 打包 iOS 原生工程与静态资源
        run: |
          mkdir -p output_ios
          zip -r output_ios/西瓜闹钟_iOS_NativeBundle.zip ios/ preview/ src/ package.json README.md

      - name: 📤 上传 iOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: 西瓜闹钟_iOS_产物包
          path: output_ios/
          retention-days: 30
